[package]
name = "vox"
version = "0.1.0"
edition = "2021"
description = "Vox — IMASM word, lifts and verdicts"
license = "Unlicense"
autobins = false

[[bin]]
name = "phase_case_encode"
path = "src/bin/phase_case_encode.rs"

[[bin]]
name = "phase_baked"
path = "src/bin/phase_baked.rs"

[[bin]]
name = "semiprime_probe"
