name: Rust tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Run library tests
        run: make test

      - name: Compile and execute baked fixed-point artifact
        run: ./scripts/test_fixed_point_baked.sh
